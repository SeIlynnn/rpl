name: Multi-Platform Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analyzer
        run: flutter analyze

      - name: Run test suite
        run: flutter test

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Build Web Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-web-bundle
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux Desktop
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Archive Linux Desktop package
        run: |
          mkdir -p dist
          tar -czvf dist/rpl-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-linux-x64
          path: dist/rpl-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows Desktop
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        shell: pwsh
        run: |
          if (!(Test-Path .env)) {
            Copy-Item .env.example .env
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Archive Windows Desktop package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\rpl-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-windows-x64
          path: dist/rpl-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS Desktop
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Archive macOS Desktop package
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r ../../../../../dist/rpl-macos.zip rpl.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-macos
          path: dist/rpl-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS Application
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup local configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS Application package
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          zip -r ../../../dist/rpl-ios.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-ios
          path: dist/rpl-ios.zip
          if-no-files-found: error
          retention-days: 14
